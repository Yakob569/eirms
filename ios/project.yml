# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# (https://github.com/yonaskolb/XcodeGen · `brew install xcodegen`)
name: EIRSPay
options:
  bundleIdPrefix: com.eirspay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode > Signing & Capabilities
packages:
  EIRSPayKit:
    path: EIRSPayKit
targets:
  EIRSPay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EIRSPay
    dependencies:
      - package: EIRSPayKit
        product: EIRSDomain
      - package: EIRSPayKit
        product: EIRSData
    info:
      path: EIRSPay/Info.plist
      properties:
        CFBundleDisplayName: EIRSPay
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLName: com.eirspay.reset
            CFBundleURLSchemes:
              - eirspay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eirspay.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  EIRSPay:
    build:
      targets:
        EIRSPay: all
    run:
      config: Debug
