name: iOS

# Builds and tests the native iOS app under ios/. Only runs when ios/ changes (or manually).
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Domain + Data package tests
        run: swift test --package-path EIRSPayKit

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project EIRSPay.xcodeproj \
            -scheme EIRSPay \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
              # Surface failures as annotations so they show up without opening the raw log.
              grep -E "error:" build.log | sort -u | head -50 | sed 's/^/::error::/' || true
              grep -q "error:" build.log || tail -30 build.log | sed 's/^/::error::/'
              exit 1
            }
